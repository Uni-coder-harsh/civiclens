plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.civiclens.app"
    compileSdk 35
    ndkVersion "25.1.8937393"

    aarMetadata {
        check = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    defaultConfig {
        applicationId "com.civiclens.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        manifestPlaceholders += [mapsApiKey: project.findProperty('MAPS_API_KEY') ?: System.getenv('MAPS_API_KEY') ?: "YOUR_API_KEY_HERE"]
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
