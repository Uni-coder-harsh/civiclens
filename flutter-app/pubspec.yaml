name: civiclens
description: "CivicLens Flutter Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core State Management & Navigation
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Camera & Media
  camera: ^0.11.0
  image: ^4.8.0
  flutter_image_compress: ^2.3.0
  package_info_plus: ^8.0.0
  uuid: ^4.4.0

  # Location & Sensors
  geolocator: ^13.0.0
  sensors_plus: ^6.0.0
  record: ^5.2.1

  # Persistence & Offline
  drift: ^2.18.0
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0

  # Network & Auth
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.0
  http: ^1.2.1
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  connectivity_plus: ^6.0.5

  # Maps & Visualization
  google_maps_flutter: ^2.7.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1

  # Analytics & Utilities
  sentry_flutter: ^8.0.0
  flutter_foreground_task: ^8.0.0
  share_plus: ^12.0.2
  permission_handler: ^11.3.0
  speech_to_text: ^7.0.0
  intl: ^0.19.0
  app_settings: ^5.1.1
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

dependency_overrides:
  record_linux: ^1.0.0

flutter:
  uses-material-design: true
