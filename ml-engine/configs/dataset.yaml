# configs/dataset.yaml
workspace:
  output_dir: "/kaggle/working"
  unified_data_dir: "/tmp/unified_dataset" # Writable location for training structure

datasets:
  rdd2022:
    name: "Road Damage Detection 2022"
    root: "/kaggle/input/rdd2022"
    format: "yolo" # RDD2022 features YOLO/VOC style annotations.
    enabled: true
    class_mapping:
      0: "longitudinal_crack" # D00
      1: "transverse_crack"   # D10
      2: "alligator_crack"    # D20
      3: "pothole"            # D40

  sdnet2018:
    name: "SDNET2018"
    root: "/kaggle/input/SDNET2018"
    format: "classification"
    enabled: false # Ignored for detection unless converted/pre-trained

  huggingface_bridge:
    name: "concrete-crack-dataset"
    hf_path: "aliasghar-j/concrete-crack-dataset"
    format: "hf"
    enabled: true
    class_mapping:
      "crack": "concrete_crack"
      "spalling": "spalling"
target_classes:
  - "pothole"
  - "longitudinal_crack"
  - "transverse_crack"
  - "alligator_crack"
  - "concrete_crack"
  - "spalling"
  - "corrosion"
