# configs/train.yaml
training:
  epochs: 100
  batch_size: 16
  imgsz: 640
  device: "cuda" # "cuda" or "cpu" or "mps"
  workers: 4
  optimizer: "AdamW" # SGD, Adam, AdamW
  lr0: 0.01          # Initial learning rate (e.g. SGD=1E-2, Adam=1E-3)
  lrf: 0.01          # Final learning rate fraction (lr0 * lrf)
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 7.5           # Box loss gain
  cls: 0.5           # Cls loss gain
  dfl: 1.5           # Dfl loss gain
  val: true          # Validate during training
  save: true
  save_period: -1    # Save checkpoint every x epochs (disabled if -1)
  cache: false       # Cache images in RAM (can set true if RAM permits)
  patience: 20       # Early stopping patience
  seed: 42
  project: "civiclens-damage-detection"
  name: "yolo11m_run"
